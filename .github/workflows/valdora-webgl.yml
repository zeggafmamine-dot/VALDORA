name: Valdora WebGL browser smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/**'
      - 'tests/browser-smoke.mjs'
  workflow_dispatch:
concurrency:
  group: valdora-webgl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright para comprobación WebGL
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Iniciar servidor del juego
        run: |
          python3 -m http.server 8765 --directory dist > /tmp/valdora-server.log 2>&1 &
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
      - name: Probar cámara y carga continua en Chromium
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: node tests/browser-smoke.mjs
